<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Panzer Krieg</title>
<style>
  body { margin:0; background:#111; display:flex; align-items:center; justify-content:center; height:100vh; font-family:Arial,sans-serif; }
  #ui { position:relative; }
  canvas { display:block; }
  #overlay {
    position:absolute; inset:0;
    background:rgba(0,0,0,0.85);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:20px;
    color:#fff;
  }
  #overlay h1 { font-size:48px; color:#4f4; margin:0; }
  #overlay p  { color:#aaa; text-align:center; line-height:1.8; margin:0; }
  #overlay button {
    padding:14px 40px; font-size:18px; cursor:pointer;
    background:#2a2; color:#fff; border:none; border-radius:4px;
  }
  #overlay button:hover { background:#4a4; }
  #controls-btn {
    padding:10px 28px; font-size:15px; cursor:pointer;
    background:transparent; color:#aaa; border:1px solid #555; border-radius:4px;
  }
  #controls-btn:hover { border-color:#aaa; color:#fff; }
  #upgrade-screen {
    position:absolute; inset:0;
    background:rgba(0,0,0,0.92);
    display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:16px;
    color:#fff;
  }
  #upgrade-screen h2 { font-size:28px; color:#fd4; margin:0; }
  .cards { display:flex; gap:14px; }
  .card {
    width:160px; padding:18px; border:2px solid #555;
    background:#1a1a1a; cursor:pointer; text-align:center;
    border-radius:6px; transition:all .15s;
  }
  .card:hover { border-color:#fd4; background:#222; transform:translateY(-4px); }
  .card .icon { font-size:32px; }
  .card .name { font-weight:bold; font-size:14px; margin:8px 0 4px; }
  .card .desc { font-size:11px; color:#999; line-height:1.4; }
  .card .rar  { font-size:10px; font-weight:bold; margin-top:8px; }
  #hud {
    position:absolute; top:0; left:0; right:0; height:34px;
    background:rgba(0,0,0,0.8); display:flex;
    align-items:center; padding:0 14px; gap:24px;
    font-size:13px; color:#ccc; pointer-events:none;
  }
  #hud span b { color:#4f4; }
  #hpbar { width:100px; height:10px; background:#333; border-radius:3px; overflow:hidden; display:inline-block; vertical-align:middle; }
  #hpfill { height:100%; background:#4c4; transition:width .2s; }
  #announce {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    font-size:36px; font-weight:bold; color:#fd4;
    text-shadow:0 0 20px #fa0; pointer-events:none;
    opacity:0; transition:opacity .5s; white-space:nowrap;
  }
</style>
</head>
<body>
<div id="ui">
  <canvas id="c" width="900" height="640"></canvas>

  <div id="hud">
    <span>HP <div id="hpbar"><div id="hpfill"></div></div> <b id="hpnum">100</b></span>
    <span>Runde <b id="rnum">1</b></span>
    <span>Score <b id="snum">0</b></span>
    <span>Kills <b id="knum">0</b></span>
  </div>

  <div id="overlay">
    <h1>PANZER KRIEG</h1>
    <p>WASD — Bewegen &nbsp;|&nbsp; Maus — Zielen &nbsp;|&nbsp; Klick — Schießen</p>
    <button id="play-btn">SPIELEN</button>
    <button id="controls-btn">STEUERUNG</button>
  </div>

  <div id="upgrade-screen">
    <h2>⭐ UPGRADE WÄHLEN</h2>
    <p style="color:#aaa;margin:0;font-size:13px">Wähle eine Verbesserung für deinen Panzer</p>
    <div class="cards" id="cards"></div>
  </div>

  <div id="announce"></div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = 900, H = 640, HUD = 34;

// ── Screens ─────────────────────────────────────────────────────
const overlay   = document.getElementById('overlay');
const upgScreen = document.getElementById('upgrade-screen');

document.getElementById('play-btn').addEventListener('click', startGame);
document.getElementById('controls-btn').addEventListener('click', () => {
  overlay.innerHTML = `
    <h1 style="font-size:32px;color:#4f4">STEUERUNG</h1>
    <table style="color:#ccc;border-spacing:8px 6px;font-size:14px">
      <tr><td style="color:#fd4;text-align:right"><b>W A S D</b></td><td>Panzer bewegen</td></tr>
      <tr><td style="color:#fd4;text-align:right"><b>Pfeiltasten</b></td><td>Panzer bewegen</td></tr>
      <tr><td style="color:#fd4;text-align:right"><b>Maus</b></td><td>Turm ausrichten</td></tr>
      <tr><td style="color:#fd4;text-align:right"><b>Klick halten</b></td><td>Dauerfeuer</td></tr>
    </table>
    <p style="color:#888;font-size:13px;text-align:center">
      Alle 5 Runden werden Gegner stärker<br>
      <span style="color:#4a4">■ Common</span> &nbsp;
      <span style="color:#44f">■ Rare</span> &nbsp;
      <span style="color:#a4a">■ Epic</span>
    </p>
    <button id="back-btn" style="padding:10px 28px;font-size:15px;cursor:pointer;background:#2a2;color:#fff;border:none;border-radius:4px">ZURÜCK</button>
  `;
  document.getElementById('back-btn').addEventListener('click', () => location.reload());
});

// ── State ────────────────────────────────────────────────────────
let state = 'menu'; // menu | playing | upgrade | dead
let round, score, kills;
let player, enemies, bullets, eBullets, particles;
let spawnQ, spawnCD, enemyLeft;
let mouseX = W/2, mouseY = H/2, mDown = false;
let keys = {};

// ── Upgrades ─────────────────────────────────────────────────────
let upg;
const UDEFS = [
  {id:'spd',  icon:'🚗',  name:'Turbo',           desc:'+Geschwindigkeit',  r:'common', w:20},
  {id:'hp',   icon:'💗',  name:'Panzerung',        desc:'+25 Max HP',        r:'common', w:20},
  {id:'bspd', icon:'🚀',  name:'Überschall',      desc:'+Projektilspeed',   r:'common', w:20},
  {id:'rate', icon:'⚡',  name:'Schnellfeuer',    desc:'+Feuerrate',        r:'rare',   w:9},
  {id:'dmg',  icon:'💥',  name:'Schwere Munition',desc:'+10 Schaden',       r:'rare',   w:9},
  {id:'arm',  icon:'🔰',  name:'Rüstung',          desc:'-4 Schaden erhalten',r:'rare',  w:7},
  {id:'prc',  icon:'🔫',  name:'Durchschlag',      desc:'Kugeln penetrieren', r:'rare',  w:5},
  {id:'rgn',  icon:'🔧',  name:'Selbstreparatur', desc:'Langsame HP-Regen',  r:'epic',  w:4},
  {id:'exp',  icon:'💣',  name:'Explosion',       desc:'Flächenschaden',     r:'epic',  w:4},
  {id:'mlt',  icon:'🔱',  name:'Drillingsrohr',   desc:'+1 Schuss',          r:'epic',  w:2},
];
const RC = {common:'#4a4', rare:'#44f', epic:'#a4a'};

function pickUpgrades() {
  let pool = UDEFS.map(u => ({...u}));
  const res = [];
  for (let i = 0; i < 3 && pool.length; i++) {
    let tot = pool.reduce((s,u) => s+u.w, 0), r = Math.random()*tot;
    let ch = pool[pool.length-1];
    for (const u of pool) { r -= u.w; if (r <= 0) { ch = u; break; } }
    res.push(ch);
    pool = pool.filter(u => u.id !== ch.id);
  }
  return res;
}

// ── World (static) ────────────────────────────────────────────────
const WALLS = [
  // houses (4 walls each = solid rect edges)
  // house 1 top-left
  {x:150,y:120,w:110,h:12},{x:150,y:200,w:110,h:12},{x:150,y:120,w:12,h:92},{x:248,y:120,w:12,h:92},
  // house 2 top-right
  {x:660,y:100,w:120,h:12},{x:660,y:185,w:120,h:12},{x:660,y:100,w:12,h:97},{x:768,y:100,w:12,h:97},
  // house 3 bottom-left
  {x:130,y:450,w:100,h:12},{x:130,y:535,w:100,h:12},{x:130,y:450,w:12,h:97},{x:218,y:450,w:12,h:97},
  // house 4 bottom-right
  {x:670,y:430,w:115,h:12},{x:670,y:520,w:115,h:12},{x:670,y:430,w:12,h:102},{x:773,y:430,w:12,h:102},
  // standalone walls
  {x:360,y:160,w:120,h:13},{x:510,y:160,w:80, h:13},
  {x:380,y:500,w:100,h:13},{x:510,y:500,w:70, h:13},
  {x:330,y:270,w:13, h:100},{x:330,y:400,w:13, h:70},
  {x:580,y:280,w:13, h:90}, {x:580,y:400,w:13, h:60},
];

// Decor-only (no collision)
const TREES = [
  {x:60, y:60, r:16},{x:100,y:300,r:14},{x:60, y:560,r:18},
  {x:840,y:60, r:15},{x:850,y:310,r:16},{x:840,y:560,r:14},
  {x:300,y:60, r:12},{x:600,y:60, r:13},{x:300,y:565,r:15},{x:600,y:560,r:12},
];
const GRASS = [
  {x:240,y:90},{x:80,y:200},{x:750,y:180},{x:200,y:380},{x:700,y:380},
  {x:400,y:70},{x:450,y:560},{x:80,y:420},{x:800,y:420},{x:500,y:310},
];

function wallHit(x, y, r) {
  for (const w of WALLS)
    if (x+r > w.x && x-r < w.x+w.w && y+r > w.y && y-r < w.y+w.h) return true;
  return false;
}

// ── Player ────────────────────────────────────────────────────────
function makePlayer() {
  return {
    x: W/2, y: H/2, angle: 0,
    hp: 100 + (upg.hp||0)*25,
    maxHp: 100 + (upg.hp||0)*25,
    spd: 2.4 + (upg.spd||0)*0.4,
    fireCD: 0,
    fireRate: Math.max(6, 22 - (upg.rate||0)*3),
    dmg: 20 + (upg.dmg||0)*10,
    bspd: 7 + (upg.bspd||0)*1.5,
    sz: 15, regenT: 0,
  };
}

// ── Enemy config ──────────────────────────────────────────────────
function eCfg(type, tier) {
  const t = tier;
  return ({
    basic:  {hp:30+t*20,  spd:.85+t*.15, dmg:8+t*3,   sz:13, col:'#c44', fr:90,  sc:10, bs:3.5},
    fast:   {hp:18+t*12,  spd:2.0+t*.3,  dmg:5+t*2,   sz:9,  col:'#c83', fr:65,  sc:15, bs:4.5},
    heavy:  {hp:80+t*50,  spd:.5+t*.08,  dmg:18+t*6,  sz:19, col:'#844', fr:140, sc:30, bs:3.0},
    sniper: {hp:25+t*15,  spd:.65+t*.1,  dmg:30+t*10, sz:11, col:'#a4c', fr:180, sc:25, bs:8.0},
    boss:   {hp:250+t*150,spd:.55+t*.1,  dmg:25+t*8,  sz:25, col:'#c22', fr:55,  sc:100,bs:4.5},
  })[type] || {hp:30,spd:.85,dmg:8,sz:13,col:'#c44',fr:90,sc:10,bs:3.5};
}

function spawnEnemy() {
  const tier = Math.floor((round-1)/5);
  const r = Math.random();
  let type = 'basic';
  if (round>=3  && r<.20) type='fast';
  if (round>=5  && r<.15) type='heavy';
  if (round>=8  && r<.12) type='sniper';
  if (round>=10 && r<.05) type='boss';
  const cfg = eCfg(type, tier);
  const side = Math.floor(Math.random()*4);
  let x,y;
  const GA = H - HUD;
  if (side===0){x=Math.random()*(W-60)+30;y=HUD-cfg.sz;}
  else if(side===1){x=W+cfg.sz;y=Math.random()*(GA-60)+HUD+30;}
  else if(side===2){x=Math.random()*(W-60)+30;y=H+cfg.sz;}
  else{x=-cfg.sz;y=Math.random()*(GA-60)+HUD+30;}
  enemies.push({x,y,type,...cfg,maxHp:cfg.hp,angle:0,fireCD:Math.floor(Math.random()*cfg.fr)});
}

// ── Fire ─────────────────────────────────────────────────────────
function firePl() {
  if (player.fireCD > 0) return;
  player.fireCD = player.fireRate;
  const shots = 1 + (upg.mlt||0);
  const spread = (shots-1)*0.13;
  const ba = Math.atan2(mouseY-player.y, mouseX-player.x);
  const tip = player.sz*1.1;
  for (let i=0; i<shots; i++) {
    const a = ba - spread/2 + (spread/Math.max(1,shots-1))*i;
    bullets.push({
      x: player.x+Math.cos(a)*tip, y: player.y+Math.sin(a)*tip,
      vx: Math.cos(a)*player.bspd,  vy: Math.sin(a)*player.bspd,
      dmg: player.dmg, pierce: (upg.prc||0)>0, exp: (upg.exp||0)>0, life:160,
    });
  }
  sparks(player.x+Math.cos(ba)*tip, player.y+Math.sin(ba)*tip, '#ff8', 4, 2);
}

function fireE(e) {
  const a = Math.atan2(player.y-e.y, player.x-e.x);
  const tip = e.sz*1.1;
  eBullets.push({x:e.x+Math.cos(a)*tip,y:e.y+Math.sin(a)*tip,vx:Math.cos(a)*e.bs,vy:Math.sin(a)*e.bs,dmg:e.dmg,life:220});
}

// ── Particles ────────────────────────────────────────────────────
function sparks(x, y, col, n, spd) {
  for (let i=0; i<n; i++) {
    const a=Math.random()*Math.PI*2, s=(Math.random()+.5)*spd;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,col,life:25+Math.random()*15,maxLife:40,sz:2+Math.random()*3});
  }
}

// ── HUD ──────────────────────────────────────────────────────────
function updateHud() {
  const pct = Math.max(0, player.hp/player.maxHp*100);
  document.getElementById('hpfill').style.width = pct+'%';
  document.getElementById('hpnum').textContent = Math.ceil(player.hp);
  document.getElementById('rnum').textContent  = round;
  document.getElementById('snum').textContent  = score;
  document.getElementById('knum').textContent  = kills;
}

// ── Announce ─────────────────────────────────────────────────────
function announce(txt) {
  const el = document.getElementById('announce');
  el.textContent = txt; el.style.opacity = '1';
  setTimeout(()=>el.style.opacity='0', 1800);
}

// ── Round ─────────────────────────────────────────────────────────
function startRound() {
  enemies=[]; bullets=[]; eBullets=[]; particles=[];
  const total = 3 + round*2 + Math.floor(round/5)*3;
  enemyLeft = total; spawnQ = total; spawnCD = 0;
  state = 'playing';
  updateHud();
  announce('RUNDE ' + round + (round%5===0 ? ' — WELLE!' : ''));
}

function roundDone() {
  state = 'upgrade';
  player.hp = Math.min(player.maxHp, player.hp+20);
  updateHud();
  const choices = pickUpgrades();
  const con = document.getElementById('cards');
  con.innerHTML = '';
  for (const u of choices) {
    const d = document.createElement('div');
    d.className = 'card';
    d.style.borderColor = RC[u.r];
    d.innerHTML = `<div class="icon">${u.icon}</div>
      <div class="name" style="color:${RC[u.r]}">${u.name}</div>
      <div class="desc">${u.desc}</div>
      <div class="rar" style="color:${RC[u.r]}">${u.r.toUpperCase()}</div>`;
    d.addEventListener('click', () => {
      upg[u.id] = (upg[u.id]||0) + 1;
      upgScreen.style.display = 'none';
      round++;
      const prevHp = player.hp;
      player = makePlayer();
      player.hp = Math.min(player.maxHp, prevHp);
      startRound();
    });
    con.appendChild(d);
  }
  upgScreen.style.display = 'flex';
}

function gameOver() {
  state = 'dead';
  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <h1 style="color:#f44">GAME OVER</h1>
    <p style="font-size:20px">Runde ${round} &nbsp;|&nbsp; Score: ${score} &nbsp;|&nbsp; Kills: ${kills}</p>
    <button id="restart-btn" style="padding:14px 40px;font-size:18px;cursor:pointer;background:#2a2;color:#fff;border:none;border-radius:4px">NEU STARTEN</button>
  `;
  document.getElementById('restart-btn').addEventListener('click', startGame);
}

// ── Start ─────────────────────────────────────────────────────────
function startGame() {
  overlay.style.display = 'none';
  upgScreen.style.display = 'none';
  round=1; score=0; kills=0;
  upg = {};
  player = makePlayer();
  startRound();
}

// ── Update ────────────────────────────────────────────────────────
function update() {
  if (state !== 'playing') return;

  // move player
  let dx=0, dy=0;
  if (keys['w']||keys['arrowup'])    dy=-1;
  if (keys['s']||keys['arrowdown'])  dy= 1;
  if (keys['a']||keys['arrowleft'])  dx=-1;
  if (keys['d']||keys['arrowright']) dx= 1;
  if (dx&&dy){dx*=.707;dy*=.707;}
  const nx=player.x+dx*player.spd, ny=player.y+dy*player.spd;
  if (nx>player.sz && nx<W-player.sz && !wallHit(nx,player.y,player.sz+1)) player.x=nx;
  if (ny>player.sz+HUD && ny<H-player.sz && !wallHit(player.x,ny,player.sz+1)) player.y=ny;
  player.angle = Math.atan2(mouseY-player.y, mouseX-player.x);
  if (player.fireCD>0) player.fireCD--;
  if (mDown) firePl();

  // regen
  if ((upg.rgn||0)>0) {
    player.regenT++;
    if (player.regenT>=120) { player.regenT=0; player.hp=Math.min(player.maxHp,player.hp+(upg.rgn||0)*2); updateHud(); }
  }

  // spawn
  if (spawnQ>0 && enemies.length<Math.min(8+round,20)) {
    spawnCD--;
    if (spawnCD<=0) { spawnEnemy(); spawnQ--; spawnCD=Math.max(18,80-round*3); }
  }

  // enemies
  for (let i=enemies.length-1;i>=0;i--) {
    const e=enemies[i];
    const ddx=player.x-e.x, ddy=player.y-e.y;
    const dist=Math.sqrt(ddx*ddx+ddy*ddy);
    e.angle=Math.atan2(ddy,ddx);
    if (dist > e.sz+player.sz) {
      const enx=e.x+(ddx/dist)*e.spd, eny=e.y+(ddy/dist)*e.spd;
      if (!wallHit(enx,e.y,e.sz+1)) e.x=enx;
      if (!wallHit(e.x,eny,e.sz+1)) e.y=eny;
    } else {
      player.hp -= Math.max(0, e.dmg*.05 - (upg.arm||0)*.2);
      updateHud();
      if (player.hp<=0) { gameOver(); return; }
    }
    e.fireCD--;
    if (e.fireCD<=0 && dist<480) { fireE(e); e.fireCD=e.fr; }
  }

  // player bullets
  for (let i=bullets.length-1;i>=0;i--) {
    const b=bullets[i];
    b.x+=b.vx; b.y+=b.vy; b.life--;
    if (b.life<=0||b.x<0||b.x>W||b.y<HUD||b.y>H||wallHit(b.x,b.y,4)){
      if(wallHit(b.x,b.y,4)) sparks(b.x,b.y,'#999',3,1.5);
      bullets.splice(i,1); continue;
    }
    let hit=false;
    for (let j=enemies.length-1;j>=0;j--) {
      const e=enemies[j];
      const dx=b.x-e.x, dy=b.y-e.y;
      if (dx*dx+dy*dy < (e.sz+4)*(e.sz+4)) {
        e.hp -= b.dmg;
        sparks(b.x,b.y,'#f82',6,3);
        if (b.exp) {
          sparks(b.x,b.y,'#fa0',14,5);
          for (const e2 of enemies){const sx=b.x-e2.x,sy=b.y-e2.y;if(sx*sx+sy*sy<3000)e2.hp-=b.dmg*.5;}
        }
        if (!b.pierce){bullets.splice(i,1);hit=true;}
        if (e.hp<=0) { score+=e.sc*round; kills++; enemyLeft--; sparks(e.x,e.y,e.col,16,3); enemies.splice(j,1); updateHud(); }
        if (hit) break;
      }
    }
  }

  // enemy bullets
  for (let i=eBullets.length-1;i>=0;i--) {
    const b=eBullets[i];
    b.x+=b.vx; b.y+=b.vy; b.life--;
    if (b.life<=0||b.x<0||b.x>W||b.y<HUD||b.y>H||wallHit(b.x,b.y,4)){
      if(wallHit(b.x,b.y,4)) sparks(b.x,b.y,'#744',3,1.5);
      eBullets.splice(i,1); continue;
    }
    const dx=b.x-player.x, dy=b.y-player.y;
    if (dx*dx+dy*dy < (player.sz+4)*(player.sz+4)) {
      player.hp -= Math.max(1, b.dmg-(upg.arm||0)*4);
      sparks(b.x,b.y,'#f44',5,2);
      eBullets.splice(i,1); updateHud();
      if (player.hp<=0) { gameOver(); return; }
    }
  }

  // particles
  for (let i=particles.length-1;i>=0;i--) {
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vx*=.9; p.vy*=.9; p.life--;
    if (p.life<=0) particles.splice(i,1);
  }

  if (spawnQ===0 && enemies.length===0 && enemyLeft<=0) roundDone();
}

// ── Draw ─────────────────────────────────────────────────────────
function drawTank(x, y, angle, sz, body, turret) {
  ctx.save(); ctx.translate(x,y); ctx.rotate(angle);
  ctx.fillStyle='#333';
  ctx.fillRect(-sz*.9,-sz*.7, sz*1.8,sz*.34);
  ctx.fillRect(-sz*.9, sz*.36,sz*1.8,sz*.34);
  ctx.fillStyle=body; ctx.fillRect(-sz*.75,-sz*.55,sz*1.5,sz*1.1);
  ctx.fillStyle=turret; ctx.beginPath(); ctx.arc(0,0,sz*.45,0,Math.PI*2); ctx.fill();
  ctx.fillRect(0,-sz*.12,sz*1.1,sz*.24);
  ctx.restore();
}

function drawHpBar(x,y,hp,maxHp,w) {
  ctx.fillStyle='#111'; ctx.fillRect(x-w/2,y-14,w,6);
  const pct=Math.max(0,hp/maxHp);
  ctx.fillStyle=pct>.5?'#4c4':pct>.25?'#cc4':'#c44';
  ctx.fillRect(x-w/2,y-14,w*pct,6);
}

function drawWorld() {
  // grass base
  ctx.fillStyle='#2a4018'; ctx.fillRect(0,HUD,W,H-HUD);

  // grass patches
  for (const g of GRASS) {
    ctx.fillStyle='#355020';
    ctx.beginPath(); ctx.ellipse(g.x,g.y,45,25,0,0,Math.PI*2); ctx.fill();
  }

  // dirt path
  ctx.fillStyle='#5a4a2e';
  ctx.fillRect(0,H/2-16,W,32);
  ctx.fillRect(W/2-16,HUD,32,H-HUD);

  // trees (behind walls)
  for (const t of TREES) {
    ctx.fillStyle='#5a3a18'; ctx.fillRect(t.x-3,t.y-4,6,10);
    ctx.fillStyle='#1e4810'; ctx.beginPath(); ctx.arc(t.x,t.y-t.r*.3,t.r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#28580a'; ctx.beginPath(); ctx.arc(t.x-t.r*.3,t.y,t.r*.65,0,Math.PI*2); ctx.fill();
  }

  // walls & houses
  for (const w of WALLS) {
    ctx.fillStyle='#7a7060'; ctx.fillRect(w.x,w.y,w.w,w.h);
    // missing chunk
    if (w.w > w.h) { // horizontal
      ctx.fillStyle='#2a4018'; ctx.fillRect(w.x+w.w*.3,w.y,w.w*.2,w.h*.6);
    } else { // vertical
      ctx.fillStyle='#2a4018'; ctx.fillRect(w.x,w.y+w.h*.3,w.w*.6,w.h*.2);
    }
    ctx.strokeStyle='#555040'; ctx.lineWidth=1.5; ctx.strokeRect(w.x,w.y,w.w,w.h);
  }

  // house interiors (visual only)
  const houseInners=[{x:162,y:132,w:86,h:68},{x:672,y:112,w:96,h:73},{x:142,y:462,w:76,h:73},{x:682,y:442,w:91,h:78}];
  for (const h of houseInners) {
    ctx.fillStyle='#3a2e1c'; ctx.fillRect(h.x,h.y,h.w,h.h);
    ctx.fillStyle='#1a1410';
    ctx.fillRect(h.x+8,h.y+8,16,12); ctx.fillRect(h.x+h.w-24,h.y+h.h-20,14,11);
    ctx.fillStyle='#5a4a38';
    ctx.fillRect(h.x+h.w*.3,h.y+h.h*.5,20,8);
  }
}

function draw() {
  drawWorld();

  // particles
  for (const p of particles) {
    ctx.globalAlpha=p.life/p.maxLife;
    ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.sz*(p.life/p.maxLife),0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  // player bullets
  ctx.shadowBlur=8; ctx.shadowColor='#fa0';
  ctx.fillStyle='#ff4';
  for (const b of bullets) { ctx.beginPath(); ctx.arc(b.x,b.y,4,0,Math.PI*2); ctx.fill(); }

  // enemy bullets
  ctx.shadowColor='#f00';
  ctx.fillStyle='#f54';
  for (const b of eBullets) { ctx.beginPath(); ctx.arc(b.x,b.y,4,0,Math.PI*2); ctx.fill(); }
  ctx.shadowBlur=0;

  // enemies
  for (const e of enemies) {
    drawTank(e.x,e.y,e.angle,e.sz,e.col,'#822');
    drawHpBar(e.x,e.y,e.hp,e.maxHp,e.sz*2.5);
    if (e.type==='boss') {
      ctx.fillStyle='#f44'; ctx.font='bold 10px Arial'; ctx.textAlign='center';
      ctx.fillText('BOSS',e.x,e.y-e.sz-16);
    }
  }

  // player
  if (state==='playing' || state==='upgrade') {
    drawTank(player.x,player.y,player.angle,player.sz,'#3a6a2a','#285020');
    ctx.fillStyle='#8f8'; ctx.beginPath(); ctx.arc(player.x,player.y,3,0,Math.PI*2); ctx.fill();
  }
}

// ── Loop ─────────────────────────────────────────────────────────
function loop() { update(); draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

// ── Input ─────────────────────────────────────────────────────────
document.addEventListener('keydown', e => { keys[e.key.toLowerCase()]=true; });
document.addEventListener('keyup',   e => { keys[e.key.toLowerCase()]=false; });
canvas.addEventListener('mousemove', e => {
  const r=canvas.getBoundingClientRect();
  mouseX=e.clientX-r.left; mouseY=e.clientY-r.top;
});
canvas.addEventListener('mousedown', () => { mDown=true; if(state==='playing') firePl(); });
canvas.addEventListener('mouseup',   () => mDown=false);
canvas.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
